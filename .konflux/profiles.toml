[common]
python_version = "3.12"
platforms = ["x86_64", "aarch64"]
# Google GenAI's build tooling needs nh3 (via twine/readme-renderer) and its
# maturin build chain. uv installs the prefetched application dependencies.
bootstrap_packages = ["maturin", "nh3", "uv"]
extras = ["all"]

[profiles.cpu]
rhoai_index_url = "https://packages.redhat.com/api/pypi/public-rhai/rhoai/3.5/cpu-ubi9/simple/"
output_suffix = ""
tekton_files = [
    ".tekton/lightspeed-agentic-sandbox-pull-request.yaml",
    ".tekton/lightspeed-agentic-sandbox-push.yaml",
]
